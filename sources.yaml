sources:
  # - name: Hacker News (100+ điểm)
  #   url: https://hnrss.org/frontpage?points=100
  #   category: general

  # - name: TechCrunch
  #   url: https://techcrunch.com/feed/
  #   category: general

  # - name: The Verge
  #   url: https://www.theverge.com/rss/index.xml
  #   category: general

  # - name: Hackaday
  #   url: https://hackaday.com/feed/
  #   category: embedded

  # - name: arXiv cs.AI
  #   url: https://rss.arxiv.org/rss/cs.AI
  #   category: ai-ml

  # - name: arXiv cs.NI (Networking)
  #   url: https://rss.arxiv.org/rss/cs.NI
  #   category: embedded

  # Linux Foundation blog: phủ rộng open source (Linux kernel, embedded, AI,
  # telecom, cloud). Bài không liên quan sẽ bị lọc bởi relevance score.
  - name: Linux Foundation Blog
    url: https://www.linuxfoundation.org/blog/rss.xml
    category: embedded

  # ĐÃ TẮT (2026-09-03): 2 nguồn dưới đây không phải bài viết thật, mỗi entry
  # chỉ là metadata/diff, ra tin rất đều đặn nên chiếm hết slot top-5 mà
  # không có nội dung — xem lại nếu muốn bật lại, cần thêm logic khác để
  # không cạnh tranh trực tiếp với các nguồn có bài viết thật.
  # - name: Linux Kernel Releases
  #   url: https://kernel.org/feeds/kdist.xml
  #   category: embedded
  # - name: eLinux Recent Changes
  #   url: https://elinux.org/index.php?title=Special:RecentChanges&feed=rss
  #   category: embedded

  # LWN.net Front Page: Nguồn tin số 1 về Linux kernel & cộng đồng.
  # Phủ rộng các thay đổi kernel mới nhất, phân tích kỹ thuật sâu.
  - name: LWN.net Front Page
    url: https://lwn.net/headlines/rss
    category: embedded

  - name: Phoronix
    url: https://www.phoronix.com/phoronix-rss.php
    category: embedded

  - name: Bootlin Blog
    url: https://bootlin.com/feed/
    category: embedded

  # Nguồn chính thức DPDK: packet processing, memory và networking.
  # Feed tổng hợp có cả tin cộng đồng/sự kiện, cần lọc relevance.
  - name: DPDK Blog
    url: https://www.dpdk.org/feed/
    category: embedded

  # Bài kỹ thuật embedded: debugging, firmware, Linux, RTOS.
  - name: Interrupt by Memfault
    url: https://interrupt.memfault.com/feed.xml
    category: embedded

  - name: CNX Software
    url: https://www.cnx-software.com/feed/
    category: embedded

  # LinuxGizmos.com: chuyên board/thiết bị nhúng chạy Linux — góc nhìn
  # thiên về device/board, bổ sung cho CNX Software (thiên SoC/silicon).
  - name: LinuxGizmos.com
    url: https://linuxgizmos.com/feed/
    category: embedded

  # AMD/Xilinx XRT (Xilinx Runtime) — driver stack chạy accelerator FPGA.
  # Thay cho Vitis_Embedded_Platform_Source (đã xác nhận chết từ 2020,
  # feed chỉ có đúng 1 release cũ) — XRT dùng GitHub Releases thật, hoạt
  # động liên tục qua 2026, đúng phần mềm sát nhất với việc dùng FPGA Xilinx.
  - name: Xilinx XRT (GitHub Releases)
    url: https://github.com/Xilinx/XRT/releases.atom
    category: embedded

  # AMD ROCm Blog: blog kỹ thuật thật (tối ưu GPU kernel, occupancy math,
  # memory scheduling...), không phải PR — đã verify nội dung sâu, ra bài
  # đều đặn suốt 2026.
  - name: AMD ROCm Blog
    url: https://rocm.blogs.amd.com/blog/atom.xml
    category: embedded

  # NVIDIA Technical Blog — tag Jetson: JetPack, Jetson Orin/Thor, edge AI.
  # Dùng feed theo tag (không phải blog chung) để tránh lẫn tin AI/gaming/
  # data-center không liên quan embedded.
  - name: NVIDIA Technical Blog (Jetson)
    url: https://developer.nvidia.com/blog/tag/jetson/feed
    category: embedded

  # Altera (tách độc lập khỏi Intel 2025) — SoCFPGA Linux kernel fork
  # chính thức. Blog/community của Altera có nội dung rất khớp (5G-A/6G,
  # Open RAN trên FPGA) nhưng không có RSS xác nhận được; dùng GitHub
  # Releases Atom của repo kernel BSP thay thế.
  - name: Altera SoCFPGA Linux Kernel (GitHub Releases)
    url: https://github.com/altera-fpga/linux-socfpga/releases.atom
    category: embedded

  # Qualcomm meta-qcom: BSP layer Yocto/OpenEmbedded chính thức cho nền
  # tảng Qualcomm (Snapdragon). Release quản lý theo milestone (git tag),
  # không phải mỗi commit — tần suất hợp lý, không lấn át top-5.
  #
  # ĐÃ THỬ THAY BẰNG pkg-linux-qcom (09/09/2026): commit activity gần đây
  # hơn qua search, nhưng xác nhận bằng bot thật ra 0 bài thô — repo đó
  # không dùng GitHub Releases (chỉ commit/tag thuần), đúng lỗi từng gặp
  # với linux-xlnx/meta-xilinx. Quay lại meta-qcom, dù 2 tháng im lặng vẫn
  # tốt hơn 0 bài vĩnh viễn.
  - name: Qualcomm meta-qcom (GitHub Releases)
    url: https://github.com/qualcomm-linux/meta-qcom/releases.atom
    category: embedded

  # RCR Wireless News: đổi sang feed gốc của site — feed FeedBurner cũ
  # (feeds.feedburner.com/rcrwireless/sLmV) đã xác nhận CHẾT từ 14/08/2026
  # bằng chính bot thật (không phải suy đoán), dù trang chủ vẫn ra bài đều.
  - name: RCR Wireless News
    url: https://rcrwireless.com/feed
    category: ran

  # IEEE Spectrum — mục Telecommunications: tạp chí kỹ thuật chính thức
  # của IEEE, bài viết có thẩm định biên tập, không phải blog/PR.
  - name: IEEE Spectrum Telecom
    url: https://spectrum.ieee.org/feeds/topic/telecommunications.rss
    category: ran

  # Các nguồn RAN bổ sung đã kiểm tra bằng feedparser ngày 2026-09-12;
  # chi tiết và các feed chưa chọn: docs/source-research-2026-09-12.md.

  # 3G4G: blog phân tích kỹ thuật độc lập về 3GPP, 5G/5G-Advanced,
  # antenna/beamforming và tiết kiệm năng lượng; có cả core/NTN/Wi-Fi.
  - name: 3G4G Blog
    url: https://blog.3g4g.co.uk/feeds/posts/default?alt=rss
    category: ran

  # NVIDIA Aerial: AI-RAN, vRAN và mô phỏng mạng vô tuyến. Feed theo tag;
  # excerpt ngắn, có cả tin sản phẩm/sự kiện nên vẫn cần lọc relevance.
  - name: NVIDIA Technical Blog (Aerial)
    url: https://developer.nvidia.com/blog/tag/aerial/feed/
    category: ran

  # Sionna: thư viện nghiên cứu/mô phỏng PHY và hệ thống vô tuyến;
  # release notes có thay đổi kỹ thuật về channel models, OFDM, 5G LDPC.
  - name: NVIDIA Sionna (GitHub Releases)
    url: https://github.com/NVlabs/sionna/releases.atom
    category: ran

  # Wireless Future: Massive MIMO, antenna, ISAC và 6G; ra bài thưa,
  # nhiều bài giới thiệu podcast/video. Bot chỉ đọc phần mô tả văn bản.
  # RSS đã kiểm tra ngày 2026-09-14: HTTP 200, 100 entry có timestamp.
  - name: Wireless Future Blog
    url: https://ma-mimo.ellintech.se/feed/
    category: ran

  # OCUDU: CU/DU, acceleration và triển khai telco cloud; có cả sự kiện.
  # RSS đã kiểm tra ngày 2026-09-14: HTTP 200, 7 entry có timestamp.
  # Summary ngắn; feed có content:encoded nhưng fetch.py chưa dùng trường này.
  - name: OCUDU Blog
    url: https://ocudu.org/category/blog/feed/
    category: ran

  # Bổ sung RAN — kiểm tra trực tiếp bằng feedparser ngày 2026-09-15:
  # HTTP 200, có ID/timestamp/summary, không lỗi parse.

  # Telecoms Infrastructure: small cells, DAS, antenna và triển khai mạng.
  # Cùng hệ 3G4G nhưng blog riêng; có thể trùng chủ đề với nguồn đang có.
  # Atom cung cấp đầy đủ text; snapshot có 25 entry, mới nhất 2026-09-15.
  - name: Telecoms Infrastructure Blog
    url: https://www.telecomsinfrastructure.com/feeds/posts/default
    category: ran

  # Ettus Research: SDR/USRP và triển khai hệ thống vô tuyến.
  # Ra bài thưa, có cả giới thiệu sản phẩm và radar ngoài cellular;
  # excerpt ~300–450 ký tự. Snapshot: 10 entry, mới nhất 2026-09-08.
  - name: Ettus Research Blog
    url: https://www.ettus.com/feed/
    category: ran

  # Nick vs Networking — chỉ mục Mobile Networks: lab small cells,
  # RNC và giao thức di động. Có cả core (PFCP/GTP/Diameter), mạng cũ
  # và opinion; không chỉ 5G RAN. Snapshot: 10 entry, mới nhất 2026-08-09.
  - name: Nick vs Networking (Mobile Networks)
    url: https://nickvsnetworking.com/category/plmn/feed/
    category: ran

  # Osmocom: stack cellular nguồn mở, OsmoTRX/BTS/PCU/BSC và release notes.
  # Chủ yếu mạng thế hệ cũ, có tin bảo trì; Atom có đầy đủ text dù trang
  # HTML đôi khi có challenge. Snapshot: 10 entry, mới nhất 2026-09-07.
  - name: Osmocom News
    url: https://osmocom.org/news.atom
    category: ran

  # arXiv cs.AR (Hardware Architecture): paper về kiến trúc máy tính,
  # accelerator, hiệu năng phần cứng — sát với hướng bạn quan tâm.
  - name: arXiv cs.AR (Computer Architecture)
    url: https://rss.arxiv.org/rss/cs.AR
    category: research

  # arXiv cs.NI (Networking and Internet Architecture): paper về mạng máy
  # tính, giao thức, network systems.
  - name: arXiv cs.NI (Computer Networking)
    url: https://rss.arxiv.org/rss/cs.NI
    category: research

  # arXiv cs.OS (Operating Systems): paper về hệ điều hành, real-time
  # scheduler, PREEMPT_RT — mảng "realtime" bạn quan tâm.
  - name: arXiv cs.OS (Operating Systems)
    url: https://rss.arxiv.org/rss/cs.OS
    category: research

  # arXiv cs.PL: ngôn ngữ lập trình, compiler, ownership và concurrency.
  # Kiểm tra 2026-09-21: HTTP 200, 7 entry, có abstract; gồm cả bản sửa đổi.
  # Chi tiết: docs/source-research-2026-09-21.md.
  - name: arXiv cs.PL (Programming Languages)
    url: https://rss.arxiv.org/rss/cs.PL
    category: research

  # SIGARCH — Computer Architecture Today: branch prediction, accelerator,
  # memory và phương pháp nghiên cứu; có cả opinion/báo cáo hội nghị.
  # RSS đã kiểm tra 2026-09-14: HTTP 200, 10 entry; mới nhất 2026-09-09.
  - name: SIGARCH Blog
    url: https://www.sigarch.org/feed/
    category: research

  # Bổ sung research — kiểm tra trực tiếp bằng feedparser ngày 2026-09-15:
  # HTTP 200, có ID/timestamp/summary. Các feed arXiv có nhiều bài mỗi đợt;
  # MAX_PER_SOURCE=5 chỉ lấy một phần, bài đăng chéo cùng ID được loại trùng.

  # arXiv cs.DC: distributed/parallel/cluster computing, GPU và HPC.
  # Phạm vi rộng, có cả blockchain/federated learning nên cần lọc relevance.
  - name: arXiv cs.DC (Distributed and Parallel Computing)
    url: https://rss.arxiv.org/rss/cs.DC
    category: research

  # arXiv cs.PF: đo/đánh giá hiệu năng, scheduling, queueing và mô phỏng.
  # Bổ sung cho cs.AR/cs.OS, gồm benchmark trên thiết bị và hệ thống mạng.
  - name: arXiv cs.PF (Performance)
    url: https://rss.arxiv.org/rss/cs.PF
    category: research

  # arXiv eess.SP: signal processing, channel estimation, MIMO/beamforming.
  # Có cả xử lý tín hiệu ngoài viễn thông; paper giữ ở research dù liên quan RAN.
  - name: arXiv eess.SP (Signal Processing)
    url: https://rss.arxiv.org/rss/eess.SP
    category: research

  # ACM SIGOPS: nghiên cứu OS/distributed systems và phương pháp đánh giá.
  # Feed theo category blog; có opinion và AI-for-systems, ra bài thưa.
  # Snapshot 2026-09-15: 4 entry, mới nhất 2026-08-04; excerpt ~400 ký tự.
  - name: ACM SIGOPS Blog
    url: https://www.sigops.org/category/blog/feed/
    category: research

  # CHỜ ĐÁNH GIÁ: Stefan Hajnoczi — QEMU, virtio, I/O và FPGA firmware.
  # Lưu để xem xét kỹ hơn trước khi bật. Atom đã kiểm tra 2026-09-14:
  # HTTP 200, 25 entry; bài mới nhất 2026-01-10, cần theo dõi hoạt động.
  # - name: Stefan Hajnoczi
  #   url: https://blog.vmsplice.net/feeds/posts/default
  #   category: virt

  # Red Hat Blog: nhiều telco dùng Red Hat OpenShift/KubeVirt làm nền tảng
  # cloud-native RAN — rất liên quan vRAN. Feed chung (không tách riêng
  # được mục Virtualization), dựa vào bước lọc relevance để loại phần
  # không liên quan (RHEL, Ansible, AI...).
  - name: Red Hat Blog
    url: https://www.redhat.com/en/rss/blog
    category: virt

  # Firecracker (GitHub Releases): microVM dùng cho serverless (AWS Lambda/
  # Fargate), đại diện xu hướng virtualization nhẹ/nhanh.
  - name: Firecracker (GitHub Releases)
    url: https://github.com/firecracker-microvm/firecracker/releases.atom
    category: virt

  # Cloud Hypervisor (GitHub Releases): VMM hiệu năng cao viết bằng Rust,
  # ban đầu từ Intel, nay do Microsoft/Crusoe/Rivos duy trì.
  - name: Cloud Hypervisor (GitHub Releases)
    url: https://github.com/cloud-hypervisor/cloud-hypervisor/releases.atom
    category: virt

  # Các feed dưới đã kiểm tra HTTP 200 + feedparser ngày 2026-09-12:
  # có entry, timestamp và summary. QEMU/Xen/KubeVirt ra bài thưa;
  # không có bài trong cửa sổ fetch không đồng nghĩa feed chết.

  # QEMU: release và bài kỹ thuật về emulation/virtualization.
  - name: QEMU Blog
    url: https://www.qemu.org/feed.xml
    category: virt

  # Xen: hypervisor cho cloud, embedded và automotive; có cả tin cộng đồng.
  - name: Xen Project Blog
    url: https://xenproject.org/feed/
    category: virt

  # KubeVirt: VM trên Kubernetes, release và thay đổi tính năng — nguồn
  # trực tiếp, tập trung hơn feed Red Hat chung ở trên.
  - name: KubeVirt Blog
    url: https://kubevirt.io/feed.xml
    category: virt

  # XCP-ng: nền tảng dựa trên Xen; cập nhật bảo mật, phát triển hypervisor
  # và hỗ trợ phần cứng (ví dụ Xen trên RISC-V). Ra bài đều hơn 3 blog trên.
  - name: XCP-ng Blog
    url: https://xcp-ng.org/blog/rss/
    category: virt

  # Harvester KB: bài kỹ thuật về KVM/KubeVirt, VM memory, migration,
  # network offload và bảo mật. Summary ngắn; nội dung đầy đủ ở trang bài.
  - name: Harvester Knowledge Base
    url: https://harvesterhci.io/kb/rss.xml
    category: virt

  # Xen Orchestra: quản lý VM, snapshot/backup, migration và API.
  # Bổ sung lớp quản lý cho XCP-ng; có thể trùng chủ đề, khác article ID.
  - name: Xen Orchestra Blog
    url: https://xen-orchestra.com/blog/rss/
    category: virt

  # Gerd Hoffmann: bài chuyên sâu về QEMU, OVMF/edk2, virtual firmware.
  # Ra bài thưa, đôi khi ngoài chủ đề. Kiểm tra 2026-09-12: HTTP 200,
  # 10 entry; feedparser có cảnh báo charset nhưng vẫn đọc được nội dung.
  - name: Gerd Hoffmann (QEMU and Firmware)
    url: https://www.kraxel.org/blog/feed/index.xml
    category: virt

    # Samsung Newsroom filtered theo tag Radio Access Network — tin 3GPP/chuẩn
  # hoá RAN thật, không chỉ press release sản phẩm. Verified 12/09/2026.
  - name: Samsung Newsroom (RAN)
    url: https://news.samsung.com/global/tag/radio-access-network/feed
    category: ran

  # Huawei press release chính thức. URL verify đúng định dạng 12/09/2026,
  # chưa audit nội dung — nhiều khả năng PR-heavy giống Red Hat Blog, cần
  # rate.py/analyze.py theo dõi ngay sau vài ngày chạy.
  - name: Huawei Press Release
    url: https://www.huawei.com/en/rss-feeds/huawei-updates/rss
    category: ran

  # Reddit qua RSS gốc (.rss suffix) — nhiễu khác kiểu Red Hat: meme/thảo
  # luận phiếm thay vì PR, prompt Bước 1 chưa được thiết kế để nhận diện
  # loại này. Rủi ro riêng: Reddit hay chặn request không có User-Agent
  # trình duyệt hợp lệ — nếu feedparser trả 403/429 trên GitHub Actions,
  # đây là nguyên nhân, không phải feed chết.
  - name: Reddit r/embedded
    url: https://www.reddit.com/r/embedded/.rss
    category: embedded

  - name: Reddit r/homelab
    url: https://www.reddit.com/r/homelab/.rss
    category: virt

  - name: Reddit r/kubernetes
    url: https://www.reddit.com/r/kubernetes/.rss
    category: virt

  - name: Reddit r/networking
    url: https://www.reddit.com/r/networking/.rss
    category: ran

  # Khi mở sang phạm vi "đa lĩnh vực" (giai đoạn 4), chỉ cần thêm nguồn mới
  # vào đây — không cần đổi code ở fetch.py/summarize.py.
