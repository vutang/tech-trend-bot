sources:
  # - name: Hacker News (100+ điểm)
  #   url: https://hnrss.org/frontpage?points=100
  #   category: general

  # - name: TechCrunch
  #   url: https://techcrunch.com/feed/
  #   category: general

  # - name: The Verge
  #   url: https://www.theverge.com/rss/index.xml
  #   category: general

  # - name: Hackaday
  #   url: https://hackaday.com/feed/
  #   category: embedded

  # - name: arXiv cs.AI
  #   url: https://rss.arxiv.org/rss/cs.AI
  #   category: ai-ml

  # - name: arXiv cs.NI (Networking)
  #   url: https://rss.arxiv.org/rss/cs.NI
  #   category: embedded

  # Linux Foundation blog: phủ rộng open source (Linux kernel, embedded, AI,
  # telecom, cloud). Bài không liên quan sẽ bị lọc bởi relevance score.
  - name: Linux Foundation Blog
    url: https://www.linuxfoundation.org/blog/rss.xml
    category: embedded

  # ĐÃ TẮT (2026-09-03): 2 nguồn dưới đây không phải bài viết thật, mỗi entry
  # chỉ là metadata/diff, ra tin rất đều đặn nên chiếm hết slot top-5 mà
  # không có nội dung — xem lại nếu muốn bật lại, cần thêm logic khác để
  # không cạnh tranh trực tiếp với các nguồn có bài viết thật.
  # - name: Linux Kernel Releases
  #   url: https://kernel.org/feeds/kdist.xml
  #   category: embedded
  # - name: eLinux Recent Changes
  #   url: https://elinux.org/index.php?title=Special:RecentChanges&feed=rss
  #   category: embedded

  # LWN.net Front Page: Nguồn tin số 1 về Linux kernel & cộng đồng.
  # Phủ rộng các thay đổi kernel mới nhất, phân tích kỹ thuật sâu.
  - name: LWN.net Front Page
    url: https://lwn.net/headlines/rss
    category: embedded

  - name: Phoronix
    url: https://www.phoronix.com/phoronix-rss.php
    category: embedded

  - name: Bootlin Blog
    url: https://bootlin.com/feed/
    category: embedded

  - name: CNX Software
    url: https://www.cnx-software.com/feed/
    category: embedded

  # LinuxGizmos.com: chuyên board/thiết bị nhúng chạy Linux — góc nhìn
  # thiên về device/board, bổ sung cho CNX Software (thiên SoC/silicon).
  - name: LinuxGizmos.com
    url: https://linuxgizmos.com/feed/
    category: embedded

  # AMD/Xilinx Vitis Embedded Platform releases (Atom feed chuẩn của
  # GitHub): bắt đúng version bump Vitis/PetaLinux/EDF thay vì chờ blog.
  - name: Xilinx Vitis Embedded Platform (GitHub Releases)
    url: https://github.com/Xilinx/Vitis_Embedded_Platform_Source/releases.atom
    category: embedded

  # NVIDIA Technical Blog — tag Jetson: JetPack, Jetson Orin/Thor, edge AI.
  # Dùng feed theo tag (không phải blog chung) để tránh lẫn tin AI/gaming/
  # data-center không liên quan embedded.
  - name: NVIDIA Technical Blog (Jetson)
    url: https://developer.nvidia.com/blog/tag/jetson/feed
    category: embedded

  # Altera (tách độc lập khỏi Intel 2025) — SoCFPGA Linux kernel fork
  # chính thức. Blog/community của Altera có nội dung rất khớp (5G-A/6G,
  # Open RAN trên FPGA) nhưng không có RSS xác nhận được; dùng GitHub
  # Releases Atom của repo kernel BSP thay thế.
  - name: Altera SoCFPGA Linux Kernel (GitHub Releases)
    url: https://github.com/altera-fpga/linux-socfpga/releases.atom
    category: embedded

  - name: RCR Wireless News
    url: https://feeds.feedburner.com/rcrwireless/sLmV
    category: ran

  # IEEE Spectrum — mục Telecommunications: tạp chí kỹ thuật chính thức
  # của IEEE, bài viết có thẩm định biên tập, không phải blog/PR.
  - name: IEEE Spectrum Telecom
    url: https://spectrum.ieee.org/feeds/topic/telecommunications.rss
    category: ran

  # arXiv cs.AR (Hardware Architecture): paper về kiến trúc máy tính,
  # accelerator, hiệu năng phần cứng — sát với hướng bạn quan tâm.
  - name: arXiv cs.AR (Computer Architecture)
    url: https://rss.arxiv.org/rss/cs.AR
    category: research

  # arXiv cs.NI (Networking and Internet Architecture): paper về mạng máy
  # tính, giao thức, network systems.
  - name: arXiv cs.NI (Computer Networking)
    url: https://rss.arxiv.org/rss/cs.NI
    category: research

  # arXiv cs.OS (Operating Systems): paper về hệ điều hành, real-time
  # scheduler, PREEMPT_RT — mảng "realtime" bạn quan tâm.
  - name: arXiv cs.OS (Operating Systems)
    url: https://rss.arxiv.org/rss/cs.OS
    category: research

  # Khi mở sang phạm vi "đa lĩnh vực" (giai đoạn 4), chỉ cần thêm nguồn mới
  # vào đây — không cần đổi code ở fetch.py/summarize.py.
  
  # NVIDIA Technical Blog — tag Jetson: JetPack, Jetson Orin/Thor, edge AI.
  # Dùng feed theo tag (không phải blog chung) để tránh lẫn tin AI/gaming/
  # data-center không liên quan embedded.
  - name: NVIDIA Technical Blog (Jetson)
    url: https://developer.nvidia.com/blog/tag/jetson/feed
    category: embedded
  
    # Altera (tách độc lập khỏi Intel 2025) — SoCFPGA Linux kernel fork
  # chính thức. Blog/community của Altera có nội dung rất khớp (5G-A/6G,
  # Open RAN trên FPGA) nhưng không có RSS xác nhận được; dùng GitHub
  # Releases Atom của repo kernel BSP thay thế.
  - name: Altera SoCFPGA Linux Kernel (GitHub Releases)
    url: https://github.com/altera-fpga/linux-socfpga/releases.atom
    category: embedded

  # Qualcomm meta-qcom: BSP layer Yocto/OpenEmbedded chính thức cho nền
  # tảng Qualcomm (Snapdragon). Release quản lý theo milestone (git tag),
  # không phải mỗi commit — tần suất hợp lý, không lấn át top-5.
  - name: Qualcomm meta-qcom (GitHub Releases)
    url: https://github.com/qualcomm-linux/meta-qcom/releases.atom
    category: embedded
  