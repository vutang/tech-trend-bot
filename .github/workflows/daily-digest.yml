name: Daily tech trend digest

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 giờ Hà Nội
  workflow_dispatch:        # cho phép bấm chạy tay để test

permissions:
  contents: write            # cần để commit lại seen.json

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Fetch, summarize & send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "tech-trend-bot"
          git config user.email "actions@github.com"

          # Commit thay đổi THẬT của seen.json (do fetch.py vừa ghi) TRƯỚC.
          # Làm sạch working tree trước khi pull --rebase — đây mới là cách
          # đúng để tránh lỗi "cannot pull with rebase: unstaged changes",
          # không phải xoá state về rỗng như bản cũ (bản cũ vô tình huỷ
          # luôn cơ chế chống trùng, vì seen.json commit lên luôn là []).
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "update seen state"
            git pull --rebase origin master
            git push
          else
            echo "No changes to commit"
          fi