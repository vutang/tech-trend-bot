name: Daily tech trend digest

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 giờ Hà Nội
  workflow_dispatch:        # cho phép bấm chạy tay để test

permissions:
  contents: write            # cần để commit lại seen.json

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Fetch, summarize & send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "tech-trend-bot"
          git config user.email "actions@github.com"
          
          # Reset seen.json về trạng thái sạch trước khi pull
          # để tránh lỗi "cannot pull with rebase: You have unstaged changes"
          git checkout -- seen.json

          # Lấy các thay đổi mới nhất từ server về
          git pull --rebase origin master

          # Ghi lại seen.json sau khi đã pull xong
          echo "[]" > seen.json
          git add seen.json

          # Kiểm tra xem có thay đổi thực sự không
          if ! git diff --cached --quiet; then
            git commit -m "update seen state"
            git push
          else
            echo "No changes to commit"
          fi