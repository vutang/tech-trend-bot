name: Daily tech trend digest

on:
  schedule:
    - cron: '47 22 * * *'   # morning: 05:47 Vietnam, next calendar day
    - cron: '47 08 * * *'   # afternoon: 15:47 Vietnam
  workflow_dispatch:
    inputs:
      session:
        description: Digest session (sends to configured Telegram chat)
        type: choice
        options:
          - morning
          - afternoon
        default: morning
        required: true

permissions:
  contents: write

concurrency:
  group: tech-trend-bot-production
  cancel-in-progress: false

jobs:
  run-digest:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-latest
    steps:
      # Checkout happens after acquiring workflow concurrency, so it reads
      # the latest branch state even when the event waited in the queue.
      # Scheduled runs use master; manual runs use the selected branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || github.ref_name }}

      - name: Resolve session and actual code revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SESSION: ${{ inputs.session }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              '47 22 * * *') session=morning ;;
              '47 08 * * *') session=afternoon ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          else
            session="$MANUAL_SESSION"
          fi
          case "$session" in
            morning|afternoon) ;;
            *) echo "Invalid session: $session" >&2; exit 1 ;;
          esac
          echo "DIGEST_SESSION=$session" >> "$GITHUB_ENV"
          echo "BOT_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Unit tests (offline, no API secrets)
        run: python -m unittest discover -s tests -v

      - name: Fetch, summarize & send
        id: pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --session "$DIGEST_SESSION"

      - name: Commit updated state and logs
        env:
          STATE_BRANCH: ${{ github.event_name == 'schedule' && 'master' || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "tech-trend-bot"
          git config user.email "actions@github.com"
          git add state.json seen.json logs/
          if ! git diff --cached --quiet; then
            git commit -m "update digest state ($DIGEST_SESSION)"
            # Preserve local state/log commits. A conflict or rejected push
            # fails the job; never reset state or silently report success.
            git pull --rebase origin "$STATE_BRANCH"
            git push origin "HEAD:$STATE_BRANCH"
          else
            echo "No changes to commit"
          fi

      - name: Preserve state and logs for recovery on failure
        if: failure() && steps.pipeline.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: digest-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state.json
            seen.json
            logs/
          retention-days: 7
